apiVersion: 1

datasources:
  - name: Sentinel ClickHouse
    uid: sentinel-clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    editable: false
    jsonData:
      host: clickhouse
      port: 8123
      protocol: http
      secure: false
      username: sentinel
      defaultDatabase: sentinel
    secureJsonData:
      password: sentinel-local
